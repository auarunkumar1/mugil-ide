name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push supersedes the previous run on the same ref — stops a wedged
# run from blocking the queue and burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Node ${{ matrix.node }} — build, typecheck, lint, test
    runs-on: ubuntu-latest
    # Hard ceiling: whatever hangs (a jest worker, a leaked socket, a native
    # addon) is killed here instead of sitting "in progress" for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        timeout-minutes: 8
        run: npm ci
      - name: Build all packages
        timeout-minutes: 8
        run: npm run build
      - name: Typecheck
        timeout-minutes: 8
        run: npm run typecheck
      - name: Lint
        timeout-minutes: 5
        run: npm run lint
      - name: Unit tests
        # jest --runInBand. `timeout` is a second line of defence: it kills the
        # process group and fails the step, so a hung handle cannot swallow the
        # remaining job minutes.
        timeout-minutes: 10
        run: timeout --kill-after=30s 540s npm test
      - name: Secret scan (all tracked files)
        timeout-minutes: 3
        run: node scripts/guard-secrets.mjs $(git ls-files)
