  <rect x="620" y="151" width="90" height="2" fill="#58a6ff" />
  <text x="632" y="141" class="text-title" font-size="11.5" fill="#58a6ff">🔍 Diff (3)</text>
  
  <text x="730" y="141" class="text-sub" font-size="11.5">🌳 CodeGraph</text>

  <!-- Diff Viewer Header -->
  <rect x="488" y="162" width="426" height="28" fill="#161b22" stroke="#30363d" stroke-width="1" rx="4" ry="4" />
  <text x="500" y="180" class="text-code" font-weight="600" fill="#58a6ff">packages/cli/src/server/html.ts</text>
  <rect x="800" y="166" width="104" height="20" rx="3" ry="3" fill="#21262d" stroke="#f85149" stroke-width="0.8" />
  <text x="808" y="180" class="text-code" font-size="10" fill="#f85149">↺ Revert Edit</text>

  <!-- Diff Content Lines -->
  <text x="500" y="210" class="text-code-muted">@@ -80,6 +80,12 @@ export function getIndexHtml(): string {</text>

  <rect x="488" y="222" width="426" height="22" fill="#1f3526" />
  <text x="500" y="237" class="text-code-green">+   &lt;button class="btn" id="btn-setup"&gt;🚀 Session Setup&lt;/button&gt;</text>

  <rect x="488" y="246" width="426" height="22" fill="#1f3526" />
  <text x="500" y="261" class="text-code-green">+   &lt;button class="btn" id="btn-turbo"&gt;⚡ Turbo&lt;/button&gt;</text>

  <text x="500" y="285" class="text-code">    const tokenLimit = config.maxTokens;</text>
  <text x="500" y="305" class="text-code">    renderModelCredits();</text>
  <text x="500" y="325" class="text-code">    attachSocketListeners();</text>

  <!-- Interactive Diff Tools Preview -->
  <rect x="488" y="350" width="426" height="85" rx="5" ry="5" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="502" y="372" class="text-title" font-size="11.5" fill="#c9d1d9">Interactive Diff Journal</text>
  <text x="502" y="392" class="text-sub" font-size="11">Every tool write generates an instant granular diff chunk.</text>
  <text x="502" y="412" class="text-sub" font-size="11">Inspect changes before running tests, or revert any single turn with 1 click.</text>


  <!-- Bottom Status Bar -->
  <rect x="10" y="514" width="920" height="34" rx="0" ry="0" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <circle cx="28" cy="531" r="4.5" fill="#3fb950" />
  <text x="40" y="535" class="text-sub" font-weight="600" fill="#3fb950">Connected</text>
  <text x="130" y="535" class="text-sub">Model: <tspan fill="#c9d1d9">minimax/minimax-m3.1-flash:free</tspan></text>
  <text x="360" y="535" class="text-sub">Session Tokens: <tspan fill="#c9d1d9">4,120 tok</tspan></text>
  
  <rect x="580" y="521" width="338" height="20" rx="10" ry="10" fill="#1f3526" stroke="#238636" stroke-width="0.8" />
