    <tspan fill="#8b949e" font-weight="600">Credited:</tspan>
    <tspan fill="#6e7681"> Caveman · RTK Headroom · Ponytail · De-AI · Watermarks · CodeGraph AST · OpenCode</tspan>
  </text>

